<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KITEGA PRIMARY SCHOOL - Students</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

/* HEADER */

header{
    background:#063b52;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.school-name{
    font-size:20px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    margin-top:5px;
    opacity:.9;
}

.back-btn{
    background:white;
    color:#063b52;
    border:none;
    padding:10px 15px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

/* TITLE */

.page-title{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.page-title h1{
    color:#063b52;
    margin-bottom:7px;
}

.page-title p{
    color:#667085;
}

/* FORM */

.form-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.form-box h2{
    color:#063b52;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input,
select{
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#168aad;
}

.register-btn{
    margin-top:20px;
    background:#063b52;
    color:white;
    border:none;
    padding:14px 22px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#0b6b8a;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

/* STUDENT LIST */

.list-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-top:20px;
}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.list-header h2{
    color:#063b52;
}

.search{
    padding:11px;
    width:250px;
    border:1px solid #d0d5dd;
    border-radius:8px;
}

/* TABLE */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px;
    border-bottom:1px solid #eaecf0;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#eef8fb;
    color:#063b52;
}

.empty{
    text-align:center;
    color:#667085;
    padding:25px;
}

.delete-btn{
    background:#d92d20;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .list-header{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .school-name{
        font-size:15px;
    }

    .subtitle{
        font-size:11px;
    }

    .back-btn{
        font-size:12px;
        padding:8px 10px;
    }
}
</style>
</head>

<body>

<header>

    <div>

        <div class="school-name">
            🏫 KITEGA PRIMARY SCHOOL
        </div>

        <div class="subtitle">
            Student Management
        </div>

    </div>

    <button
        class="back-btn"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</header>


<main class="container">

    <!-- TITLE -->

    <section class="page-title">

        <h1>
            Student Management 👨‍🎓
        </h1>

        <p>
            Register and manage KITEGA Primary School students.
        </p>

    </section>


    <!-- REGISTRATION FORM -->

    <section class="form-box">

        <h2>
            Register New Student
        </h2>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="registrationNo">
                        Registration Number
                    </label>

                    <input
                        id="registrationNo"
                        type="text"
                        placeholder="Example: KPS001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        placeholder="Student full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        required>

                        <option value="">
                            Select gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="className">
                        Class
                    </label>

                    <select
                        id="className"
                        required>

                        <option value="">
                            Select class
                        </option>

                        <option value="Standard 1">
                            Standard 1
                        </option>

                        <option value="Standard 2">
                            Standard 2
                        </option>

                        <option value="Standard 3">
                            Standard 3
                        </option>

                        <option value="Standard 4">
                            Standard 4
                        </option>

                        <option value="Standard 5">
                            Standard 5
                        </option>

                        <option value="Standard 6">
                            Standard 6
                        </option>

                        <option value="Standard 7">
                            Standard 7
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="parentName">
                        Parent / Guardian Name
                    </label>

                    <input
                        id="parentName"
                        type="text"
                        placeholder="Parent or guardian name"
                    >

                </div>


                <div class="form-group">

                    <label for="parentPhone">
                        Parent Phone
                    </label>

                    <input
                        id="parentPhone"
                        type="tel"
                        placeholder="Example: 0712345678"
                    >

                </div>


                <div class="form-group full">

                    <label for="dateOfBirth">
                        Date of Birth
                    </label>

                    <input
                        id="dateOfBirth"
                        type="date"
                    >

                </div>

            </div>


            <button
                class="register-btn"
                type="submit">

                + REGISTER STUDENT

            </button>


            <div
                class="message"
                id="message">
            </div>

        </form>

    </section>


    <!-- STUDENT LIST -->

    <section class="list-box">

        <div class="list-header">

            <h2>
                Registered Students
            </h2>

            <input
                class="search"
                id="search"
                type="text"
                placeholder="Search student..."
            >

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Reg. No.
                        </th>

                        <th>
                            Full Name
                        </th>

                        <th>
                            Gender
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Parent
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

/*
====================================
KITEGA PRIMARY SCHOOL
STUDENT MANAGEMENT
====================================
*/


/* GET STUDENTS */

function getStudents(){

    return JSON.parse(
        localStorage.getItem("kitegaStudents") || "[]"
    );

}


/* SAVE STUDENTS */

function saveStudents(students){

    localStorage.setItem(
        "kitegaStudents",
        JSON.stringify(students)
    );

}


/* DISPLAY STUDENTS */

function displayStudents(searchText = ""){

    const students = getStudents();

    const table =
        document.getElementById("studentTable");

    table.innerHTML = "";


    const filtered =
        students.filter(function(student){

            const text = (

                student.registrationNo +
                " " +
                student.fullName +
                " " +
                student.className +
                " " +
                student.parentName

            ).toLowerCase();

            return text.includes(
                searchText.toLowerCase()
            );

        });


    if(filtered.length === 0){

        table.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty">

                    No students registered yet.

                </td>
            </tr>
        `;

        return;

    }


    filtered.forEach(function(student){

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(student.registrationNo)}
            </td>

            <td>
                ${escapeHTML(student.fullName)}
            </td>

            <td>
                ${escapeHTML(student.gender)}
            </td>

            <td>
                ${escapeHTML(student.className)}
            </td>

            <td>
                ${escapeHTML(student.parentName || "-")}
            </td>

            <td>
                ${escapeHTML(student.parentPhone || "-")}
            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteStudent('${student.id}')">

                    Delete

                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


/* REGISTER */

document
.getElementById("studentForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const registrationNo =
            document
            .getElementById("registrationNo")
            .value
            .trim();


        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();


        const gender =
            document
            .getElementById("gender")
            .value;


        const className =
            document
            .getElementById("className")
            .value;


        const parentName =
            document
            .getElementById("parentName")
            .value
            .trim();


        const parentPhone =
            document
            .getElementById("parentPhone")
            .value
            .trim();


        const dateOfBirth =
            document
            .getElementById("dateOfBirth")
            .value;


        const message =
            document
            .getElementById("message");


        const students =
            getStudents();


        /* CHECK DUPLICATE REGISTRATION */

        const exists =
            students.some(function(student){

                return student.registrationNo
                    .toLowerCase()
                    ===
                    registrationNo.toLowerCase();

            });


        if(exists){

            message.style.color = "red";

            message.textContent =
                "Registration number already exists.";

            return;

        }


        /* CREATE STUDENT */

        const student = {

            id:
                Date.now().toString(),

            registrationNo:
                registrationNo,

            fullName:
                fullName,

            gender:
                gender,

            className:
                className,

            parentName:
                parentName,

            parentPhone:
                parentPhone,

            dateOfBirth:
                dateOfBirth

        };


        students.push(student);


        saveStudents(students);


        /* SUCCESS */

        message.style.color = "green";

        message.textContent =
            "Student registered successfully!";


        /* CLEAR FORM */

        document
        .getElementById("studentForm")
        .reset();


        /* REFRESH LIST */

        displayStudents();

    }
);


/* SEARCH */

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        displayStudents(
            this.value
        );

    }
);


/* DELETE */

function deleteStudent(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if(!confirmDelete){

        return;

    }


    const students =
        getStudents();


    const updated =
        students.filter(function(student){

            return student.id !== id;

        });


    saveStudents(updated);


    displayStudents();

}


/* SAFE TEXT */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* BACK TO DASHBOARD */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* INITIAL DISPLAY */

displayStudents();

</script>

</body>
</html>
