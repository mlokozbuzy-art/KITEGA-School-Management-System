<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classes Management - KITEGA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#063b52;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    margin-top:5px;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:#087ea4;
    color:white;
}

.logout{
    background:#d92d20;
    color:white;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto;
}

.section{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:25px;
}

h1,h2{
    color:#063b52;
    margin-bottom:18px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input{
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#087ea4;
}

.submit{
    grid-column:1/-1;
    background:#063b52;
    color:white;
    font-size:15px;
}

.cancel{
    display:none;
    background:#667085;
    color:white;
}

.message{
    grid-column:1/-1;
    font-weight:bold;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.search{
    width:300px;
    padding:11px;
    border:1px solid #d0d5dd;
    border-radius:8px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eaecf0;
    text-align:left;
}

th{
    background:#eef8fb;
    color:#063b52;
}

.edit{
    background:#087ea4;
    color:white;
    margin-right:5px;
}

.delete{
    background:#d92d20;
    color:white;
}

.empty{
    text-align:center;
    padding:25px;
    color:#667085;
}

footer{
    text-align:center;
    padding:30px;
    color:#98a2b3;
    font-size:13px;
}

@media(max-width:650px){

    header{
        flex-direction:column;
        align-items:stretch;
    }

    .buttons{
        justify-content:flex-end;
    }

    .form{
        grid-template-columns:1fr;
    }

    .submit,
    .cancel,
    .message{
        grid-column:auto;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }
}

</style>

</head>

<body>


<header>

<div>

<div class="title">
🏫 CLASSES MANAGEMENT
</div>

<div class="subtitle">
KITEGA Primary School
</div>

</div>


<div class="buttons">

<button
class="back"
onclick="goDashboard()">

← Dashboard

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</header>


<main class="container">


<!-- ADD CLASS -->

<section class="section">

<h1 id="formTitle">
➕ Add Class
</h1>


<form
id="classForm"
class="form">


<div class="group">

<label>
Class Name
</label>

<input
type="text"
id="className"
placeholder="Example: Standard 1"
required>

</div>


<div class="group">

<label>
Class Teacher
</label>

<input
type="text"
id="classTeacher"
placeholder="Example: Mr. John">

</div>


<div class="group">

<label>
Academic Year
</label>

<input
type="number"
id="academicYear"
value="2026"
required>

</div>


<div class="group">

<label>
Description
</label>

<input
type="text"
id="description"
placeholder="Optional description">

</div>


<button
type="submit"
class="submit"
id="submitButton">

REGISTER CLASS

</button>


<button
type="button"
class="cancel"
id="cancelButton"
onclick="cancelEdit()">

CANCEL EDIT

</button>


<div
id="message"
class="message">

</div>

</form>

</section>


<!-- CLASS LIST -->

<section class="section">


<div class="top">

<h2>
📋 Registered Classes
</h2>


<input
type="text"
id="search"
class="search"
placeholder="🔍 Search class...">

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>#</th>

<th>Class</th>

<th>Class Teacher</th>

<th>Academic Year</th>

<th>Description</th>

<th>Action</th>

</tr>

</thead>


<tbody id="classTable">

</tbody>

</table>

</div>

</section>


</main>


<footer>

© 2026 KITEGA PRIMARY SCHOOL

<br>

School Management System

</footer>


<script>


/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   EDIT ID
================================ */

let editingClassId = null;


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;

}


/* ================================
   LOAD CLASSES
================================ */

async function loadClasses(
    searchText = ""
){

    const table =
    document.getElementById(
        "classTable"
    );


    table.innerHTML = `
        <tr>
            <td colspan="6"
                class="empty">
                Loading classes...
            </td>
        </tr>
    `;


    const { data,error } =
    await supabaseClient

    .from("classes")

    .select("*")

    .order(
        "id",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);


        table.innerHTML = `
            <tr>
                <td colspan="6"
                    class="empty">

                    Failed to load classes.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </td>
            </tr>
        `;

        return;
    }


    let classes =
    data || [];


    const search =
    searchText
    .toLowerCase()
    .trim();


    if(search){

        classes =
        classes.filter(
            function(item){

                const text =
                (
                    item.class_name || ""
                ) +
                " " +
                (
                    item.class_teacher || ""
                ) +
                " " +
                (
                    item.description || ""
                );


                return text
                .toLowerCase()
                .includes(search);

            }
        );

    }


    table.innerHTML = "";


    if(classes.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="6"
                    class="empty">

                    No classes registered yet.

                </td>
            </tr>
        `;

        return;
    }


    classes.forEach(
        function(item,index){

            const row =
            document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(
                        item.class_name || "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.class_teacher || "-"
                    )}
                </td>

                <td>
                    ${item.academic_year || "-"}
                </td>

                <td>
                    ${escapeHTML(
                        item.description || "-"
                    )}
                </td>

                <td>

                    <button
                        class="edit"
                        onclick="
                        editClass(
                            ${item.id}
                        )">

                        Edit

                    </button>


                    <button
                        class="delete"
                        onclick="
                        deleteClass(
                            ${item.id}
                        )">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* ================================
   SAVE CLASS
================================ */

document
.getElementById("classForm")
.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const message =
    document.getElementById(
        "message"
    );


    const className =
    document.getElementById(
        "className"
    ).value.trim();


    const classTeacher =
    document.getElementById(
        "classTeacher"
    ).value.trim();


    const academicYear =
    Number(
        document.getElementById(
            "academicYear"
        ).value
    );


    const description =
    document.getElementById(
        "description"
    ).value.trim();


    /* UPDATE */

    if(editingClassId !== null){

        const { error } =
        await supabaseClient

        .from("classes")

        .update({

            class_name:
            className,

            class_teacher:
            classTeacher || null,

            academic_year:
            academicYear,

            description:
            description || null

        })

        .eq(
            "id",
            editingClassId
        );


        if(error){

            message.style.color =
            "red";

            message.textContent =
            "Failed to update class: " +
            error.message;

            return;
        }


        message.style.color =
        "green";

        message.textContent =
        "Class updated successfully.";


        cancelEdit();

        loadClasses();

        return;
    }


    /* INSERT */

    const { error } =
    await supabaseClient

    .from("classes")

    .insert({

        class_name:
        className,

        class_teacher:
        classTeacher || null,

        academic_year:
        academicYear,

        description:
        description || null

    });


    if(error){

        console.error(error);


        message.style.color =
        "red";

        message.textContent =
        "Failed to register class: " +
        error.message;

        return;
    }


    message.style.color =
    "green";

    message.textContent =
    "Class registered successfully.";


    document
    .getElementById(
        "classForm"
    )
    .reset();


    document.getElementById(
        "academicYear"
    ).value =
    "2026";


    loadClasses();

});


/* ================================
   EDIT CLASS
================================ */

async function editClass(id){

    const { data,error } =
    await supabaseClient

    .from("classes")

    .select("*")

    .eq(
        "id",
        id
    )

    .single();


    if(error){

        alert(
            "Failed to load class: " +
            error.message
        );

        return;
    }


    document.getElementById(
        "className"
    ).value =
    data.class_name || "";


    document.getElementById(
        "classTeacher"
    ).value =
    data.class_teacher || "";


    document.getElementById(
        "academicYear"
    ).value =
    data.academic_year || "2026";


    document.getElementById(
        "description"
    ).value =
    data.description || "";


    editingClassId =
    id;


    document.getElementById(
        "formTitle"
    ).textContent =
    "✏️ Edit Class";


    document.getElementById(
        "submitButton"
    ).textContent =
    "UPDATE CLASS";


    document.getElementById(
        "cancelButton"
    ).style.display =
    "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ================================
   CANCEL EDIT
================================ */

function cancelEdit(){

    editingClassId =
    null;


    document
    .getElementById(
        "classForm"
    )
    .reset();


    document.getElementById(
        "academicYear"
    ).value =
    "2026";


    document.getElementById(
        "formTitle"
    ).textContent =
    "➕ Add Class";


    document.getElementById(
        "submitButton"
    ).textContent =
    "REGISTER CLASS";


    document.getElementById(
        "cancelButton"
    ).style.display =
    "none";


    document.getElementById(
        "message"
    ).textContent =
    "";

}


/* ================================
   DELETE CLASS
================================ */

async function deleteClass(id){

    const confirmed =
    confirm(
        "Are you sure you want to delete this class?"
    );


    if(!confirmed)
        return;


    const { error } =
    await supabaseClient

    .from("classes")

    .delete()

    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "Failed to delete class: " +
            error.message
        );

        return;
    }


    loadClasses();

}


/* ================================
   SEARCH
================================ */

document
.getElementById("search")
.addEventListener(
"input",
function(){

    loadClasses(
        this.value
    );

});


/* ================================
   NAVIGATION
================================ */

function goDashboard(){

    window.location.href =
    "dashboard.html";

}


function logout(){

    window.location.href =
    "index.html";

}


/* ================================
   START
================================ */

loadClasses();

</script>

</body>
</html>
