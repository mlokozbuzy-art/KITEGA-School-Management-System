<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fees & Payments - KITEGA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#063b52;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    margin-top:5px;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:#087ea4;
    color:white;
}

.logout{
    background:#d92d20;
    color:white;
}

.container{
    width:94%;
    max-width:1250px;
    margin:25px auto;
}

.section{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:25px;
}

h1,h2{
    color:#063b52;
    margin-bottom:18px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#087ea4;
}

.submit{
    grid-column:1/-1;
    background:#063b52;
    color:white;
    font-size:15px;
}

.cancel{
    display:none;
    background:#667085;
    color:white;
}

.message{
    grid-column:1/-1;
    font-weight:bold;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.search{
    width:320px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card-title{
    color:#667085;
    font-size:14px;
}

.card-value{
    color:#063b52;
    font-size:25px;
    font-weight:bold;
    margin-top:8px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eaecf0;
    text-align:left;
    vertical-align:top;
}

th{
    background:#eef8fb;
    color:#063b52;
}

.edit{
    background:#087ea4;
    color:white;
    margin-right:5px;
}

.delete{
    background:#d92d20;
    color:white;
}

.empty{
    text-align:center;
    padding:25px;
    color:#667085;
}

.loading{
    color:#667085;
    font-size:14px;
    margin-top:5px;
}

footer{
    text-align:center;
    padding:30px;
    color:#98a2b3;
    font-size:13px;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        align-items:stretch;
    }

    .buttons{
        justify-content:flex-end;
    }

    .form{
        grid-template-columns:1fr;
    }

    .full,
    .submit,
    .cancel,
    .message{
        grid-column:auto;
    }

    .summary{
        grid-template-columns:1fr;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

}

</style>

</head>


<body>


<header>

<div>

<div class="title">
💰 FEES & PAYMENTS MANAGEMENT
</div>

<div class="subtitle">
KITEGA School Management System
</div>

</div>


<div class="buttons">

<button
class="back"
onclick="goDashboard()">

← Dashboard

</button>


<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</header>


<main class="container">


<!-- =========================
     PAYMENT FORM
========================= -->

<section class="section">

<h1 id="formTitle">
➕ Record Student Payment
</h1>


<form
id="paymentForm"
class="form">


<!-- STUDENT -->

<div class="group">

<label>
Student
</label>

<select
id="studentId"
required>

<option value="">
Loading students...
</option>

</select>

<div
id="studentLoading"
class="loading">
</div>

</div>


<!-- AMOUNT -->

<div class="group">

<label>
Amount Paid
</label>

<input
type="number"
id="amount"
placeholder="Example: 50000"
min="0"
step="0.01"
required>

</div>


<!-- DATE -->

<div class="group">

<label>
Payment Date
</label>

<input
type="date"
id="paymentDate"
required>

</div>


<!-- METHOD -->

<div class="group">

<label>
Payment Method
</label>

<select id="paymentMethod">

<option value="">
Select payment method
</option>

<option value="Cash">
Cash
</option>

<option value="Bank">
Bank
</option>

<option value="Mobile Money">
Mobile Money
</option>

<option value="Card">
Card
</option>

</select>

</div>


<!-- REFERENCE -->

<div class="group">

<label>
Reference Number
</label>

<input
type="text"
id="reference"
placeholder="Example: TXN12345">

</div>


<!-- STATUS -->

<div class="group">

<label>
Status
</label>

<select id="status">

<option value="Paid">
Paid
</option>

<option value="Pending">
Pending
</option>

<option value="Cancelled">
Cancelled
</option>

</select>

</div>


<!-- REMARKS -->

<div class="group full">

<label>
Remarks
</label>

<textarea
id="remarks"
placeholder="Optional remarks..."></textarea>

</div>


<button
type="submit"
id="submitButton"
class="submit">

SAVE PAYMENT

</button>


<button
type="button"
id="cancelButton"
class="cancel"
onclick="cancelEdit()">

CANCEL EDIT

</button>


<div
id="message"
class="message">

</div>


</form>

</section>


<!-- =========================
     SUMMARY
========================= -->

<section class="summary">


<div class="card">

<div class="card-title">
Total Payment Records
</div>

<div
id="totalPayments"
class="card-value">
0
</div>

</div>


<div class="card">

<div class="card-title">
Total Amount Paid
</div>

<div
id="totalAmount"
class="card-value">
TZS 0
</div>

</div>


<div class="card">

<div class="card-title">
Paid Records
</div>

<div
id="paidRecords"
class="card-value">
0
</div>

</div>


</section>


<!-- =========================
     PAYMENT TABLE
========================= -->

<section class="section">


<div class="top">

<h2>
📋 Payment Records
</h2>


<input
type="text"
id="search"
class="search"
placeholder="🔍 Search student or payment...">

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>#</th>

<th>Student</th>

<th>Amount</th>

<th>Date</th>

<th>Method</th>

<th>Reference</th>

<th>Status</th>

<th>Remarks</th>

<th>Action</th>

</tr>

</thead>


<tbody id="paymentTable">

<tr>

<td
colspan="9"
class="empty">

Loading payments...

</td>

</tr>

</tbody>

</table>

</div>

</section>


</main>


<footer>

© 2026 KITEGA SCHOOL

<br>

School Management System

</footer>


<script>


/* =================================
   SUPABASE CONFIGURATION
================================= */

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let editingId = null;


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;

}


/* =================================
   TODAY
================================= */

document.getElementById(
    "paymentDate"
).value =
new Date()
.toISOString()
.split("T")[0];


/* =================================
   LOAD STUDENTS
================================= */

async function loadStudents(){

    const select =
    document.getElementById(
        "studentId"
    );


    const loading =
    document.getElementById(
        "studentLoading"
    );


    select.innerHTML = `
        <option value="">
            Loading students...
        </option>
    `;


    const {data,error} =
    await supabaseClient

    .from("students")

    .select("*")

    .order(
        "id",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);


        select.innerHTML = `
            <option value="">
                Failed to load students
            </option>
        `;


        loading.style.color =
        "red";


        loading.textContent =
        error.message;


        return;
    }


    if(!data || data.length === 0){

        select.innerHTML = `
            <option value="">
                No students registered
            </option>
        `;


        return;
    }


    select.innerHTML = `
        <option value="">
            Select student
        </option>
    `;


    data.forEach(function(student){

        const option =
        document.createElement("option");


        option.value =
        student.id;


        const name =
        student.full_name ||
        student.name ||
        student.student_name ||
        "Student";


        const reg =
        student.registration_number ||
        student.reg_no ||
        student.username ||
        "";


        option.textContent =
        reg
        ? name + " — " + reg
        : name;


        select.appendChild(
            option
        );

    });

}


/* =================================
   GET STUDENT NAME
================================= */

function getStudentName(
    studentId,
    students
){

    const student =
    students.find(
        function(item){

            return String(item.id) ===
            String(studentId);

        }
    );


    if(!student){

        return "Student #" +
        studentId;

    }


    return (
        student.full_name ||
        student.name ||
        student.student_name ||
        "Student #" + studentId
    );

}


/* =================================
   LOAD PAYMENTS
================================= */

async function loadPayments(
    searchText=""
){

    const table =
    document.getElementById(
        "paymentTable"
    );


    table.innerHTML = `
        <tr>
            <td colspan="9"
                class="empty">

                Loading payments...

            </td>
        </tr>
    `;


    /* GET STUDENTS */

    const studentsResult =
    await supabaseClient

    .from("students")

    .select("*");


    const students =
    studentsResult.data || [];


    /* GET PAYMENTS */

    const {data,error} =
    await supabaseClient

    .from("payments")

    .select("*")

    .order(
        "id",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);


        table.innerHTML = `
            <tr>

                <td
                colspan="9"
                class="empty">

                Failed to load payments.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                </td>

            </tr>
        `;

        return;
    }


    const allPayments =
    data || [];


    updateSummary(
        allPayments
    );


    let payments =
    allPayments;


    const search =
    searchText
    .toLowerCase()
    .trim();


    if(search){

        payments =
        payments.filter(
            function(payment){

                const studentName =
                getStudentName(
                    payment.student_id,
                    students
                );


                const text =
                studentName +
                " " +
                payment.student_id +
                " " +
                payment.amount +
                " " +
                (
                    payment.payment_method ||
                    ""
                ) +
                " " +
                (
                    payment.reference ||
                    ""
                ) +
                " " +
                (
                    payment.status ||
                    ""
                );


                return text
                .toLowerCase()
                .includes(search);

            }
        );

    }


    table.innerHTML = "";


    if(payments.length === 0){

        table.innerHTML = `
            <tr>

                <td
                colspan="9"
                class="empty">

                No payment records found.

                </td>

            </tr>
        `;

        return;
    }


    payments.forEach(
        function(payment,index){

            const row =
            document.createElement("tr");


            const studentName =
            getStudentName(
                payment.student_id,
                students
            );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${escapeHTML(
                            studentName
                        )}
                    </strong>
                </td>

                <td>
                    TZS
                    ${Number(
                        payment.amount || 0
                    ).toLocaleString()}
                </td>

                <td>
                    ${escapeHTML(
                        payment.payment_date ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        payment.payment_method ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        payment.reference ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        payment.status ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        payment.remarks ||
                        "-"
                    )}
                </td>

                <td>

                    <button
                    class="edit"
                    onclick="
                    editPayment(
                        ${payment.id}
                    )">

                    Edit

                    </button>


                    <button
                    class="delete"
                    onclick="
                    deletePayment(
                        ${payment.id}
                    )">

                    Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* =================================
   SUMMARY
================================= */

function updateSummary(
    payments
){

    const totalRecords =
    payments.length;


    const totalAmount =
    payments.reduce(
        function(sum,item){

            return sum +
            Number(
                item.amount || 0
            );

        },
        0
    );


    const paidRecords =
    payments.filter(
        function(item){

            return item.status ===
            "Paid";

        }
    ).length;


    document.getElementById(
        "totalPayments"
    ).textContent =
    totalRecords;


    document.getElementById(
        "totalAmount"
    ).textContent =
    "TZS " +
    totalAmount.toLocaleString();


    document.getElementById(
        "paidRecords"
    ).textContent =
    paidRecords;

}


/* =================================
   SAVE PAYMENT
================================= */

document
.getElementById(
    "paymentForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const message =
        document.getElementById(
            "message"
        );


        const studentId =
        document.getElementById(
            "studentId"
        ).value;


        const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


        const paymentDate =
        document.getElementById(
            "paymentDate"
        ).value;


        const paymentMethod =
        document.getElementById(
            "paymentMethod"
        ).value;


        const reference =
        document.getElementById(
            "reference"
        ).value.trim();


        const status =
        document.getElementById(
            "status"
        ).value;


        const remarks =
        document.getElementById(
            "remarks"
        ).value.trim();


        if(!studentId){

            message.style.color =
            "red";


            message.textContent =
            "Please select a student.";


            return;
        }


        if(amount <= 0){

            message.style.color =
            "red";


            message.textContent =
            "Please enter a valid amount.";


            return;
        }


        const record = {

            student_id:
            Number(studentId),

            amount:
            amount,

            payment_date:
            paymentDate,

            payment_method:
            paymentMethod || null,

            reference:
            reference || null,

            status:
            status,

            remarks:
            remarks || null

        };


        let error;


        /* UPDATE */

        if(editingId !== null){

            const result =
            await supabaseClient

            .from("payments")

            .update(record)

            .eq(
                "id",
                editingId
            );


            error =
            result.error;

        }


        /* INSERT */

        else{

            const result =
            await supabaseClient

            .from("payments")

            .insert(
                record
            );


            error =
            result.error;

        }


        if(error){

            console.error(error);


            message.style.color =
            "red";


            message.textContent =
            "Failed to save payment: " +
            error.message;


            return;
        }


        message.style.color =
        "green";


        message.textContent =
        editingId !== null
        ? "Payment updated successfully."
        : "Payment saved successfully.";


        cancelEdit();


        await loadPayments();

    }
);


/* =================================
   EDIT PAYMENT
================================= */

async function editPayment(
    id
){

    const {data,error} =
    await supabaseClient

    .from("payments")

    .select("*")

    .eq(
        "id",
        id
    )

    .single();


    if(error){

        alert(
            "Failed to load payment: " +
            error.message
        );

        return;
    }


    document.getElementById(
        "studentId"
    ).value =
    data.student_id || "";


    document.getElementById(
        "amount"
    ).value =
    data.amount || "";


    document.getElementById(
        "paymentDate"
    ).value =
    data.payment_date || "";


    document.getElementById(
        "paymentMethod"
    ).value =
    data.payment_method || "";


    document.getElementById(
        "reference"
    ).value =
    data.reference || "";


    document.getElementById(
        "status"
    ).value =
    data.status || "Paid";


    document.getElementById(
        "remarks"
    ).value =
    data.remarks || "";


    editingId =
    id;


    document.getElementById(
        "formTitle"
    ).textContent =
    "✏️ Edit Payment";


    document.getElementById(
        "submitButton"
    ).textContent =
    "UPDATE PAYMENT";


    document.getElementById(
        "cancelButton"
    ).style.display =
    "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =================================
   CANCEL EDIT
================================= */

function cancelEdit(){

    editingId =
    null;


    document
    .getElementById(
        "paymentForm"
    )
    .reset();


    document.getElementById(
        "paymentDate"
    ).value =
    new Date()
    .toISOString()
    .split("T")[0];


    document.getElementById(
        "formTitle"
    ).textContent =
    "➕ Record Student Payment";


    document.getElementById(
        "submitButton"
    ).textContent =
    "SAVE PAYMENT";


    document.getElementById(
        "cancelButton"
    ).style.display =
    "none";


    document.getElementById(
        "message"
    ).textContent =
    "";

}


/* =================================
   DELETE PAYMENT
================================= */

async function deletePayment(
    id
){

    const confirmed =
    confirm(
        "Are you sure you want to delete this payment?"
    );


    if(!confirmed)
        return;


    const {error} =
    await supabaseClient

    .from("payments")

    .delete()

    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "Failed to delete payment: " +
            error.message
        );

        return;
    }


    loadPayments();

}


/* =================================
   SEARCH
================================= */

document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    function(){

        loadPayments(
            this.value
        );

    }
);


/* =================================
   NAVIGATION
================================= */

function goDashboard(){

    window.location.href =
    "dashboard.html";

}


function logout(){

    window.location.href =
    "index.html";

}


/* =================================
   START
================================= */

async function start(){

    await loadStudents();

    await loadPayments();

}


start();

</script>

</body>

    </html>
