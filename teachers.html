<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management - KITEGA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #063b52;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .title {
            font-size: 21px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 13px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            background: #087ea4;
            color: white;
        }

        .logout {
            background: #d92d20;
            color: white;
        }

        .container {
            width: 94%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 25px;
        }

        h1, h2 {
            color: #063b52;
            margin-bottom: 18px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #344054;
        }

        input {
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #087ea4;
        }

        .submit {
            grid-column: 1 / -1;
            background: #063b52;
            color: white;
            font-size: 15px;
        }

        .cancel {
            display: none;
            background: #667085;
            color: white;
        }

        .message {
            grid-column: 1 / -1;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .search {
            width: 300px;
            padding: 11px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eaecf0;
            text-align: left;
        }

        th {
            background: #eef8fb;
            color: #063b52;
        }

        .edit {
            background: #087ea4;
            color: white;
            margin-right: 5px;
        }

        .delete {
            background: #d92d20;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #667085;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #98a2b3;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .buttons {
                justify-content: flex-end;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .submit,
            .cancel,
            .message {
                grid-column: auto;
            }

            .top {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div>
        <div class="title">👨‍🏫 TEACHER MANAGEMENT</div>
        <div class="subtitle">KITEGA Primary School</div>
    </div>

    <div class="buttons">
        <button class="back" onclick="goDashboard()">← Dashboard</button>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

</header>


<main class="container">

    <!-- REGISTER TEACHER -->

    <section class="section">

        <h1 id="formTitle">➕ Register Teacher</h1>

        <form id="teacherForm" class="form">

            <div class="group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="teacherName"
                    placeholder="Enter teacher full name"
                    required
                >
            </div>

            <div class="group">
                <label>Username</label>
                <input
                    type="text"
                    id="teacherUsername"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="group">
                <label>Class</label>
                <input
                    type="text"
                    id="teacherClass"
                    placeholder="Example: Standard 4"
                >
            </div>

            <div class="group">
                <label>Phone</label>
                <input
                    type="tel"
                    id="teacherPhone"
                    placeholder="Enter phone number"
                >
            </div>

            <button
                type="submit"
                id="teacherSubmit"
                class="submit"
            >
                REGISTER TEACHER
            </button>

            <button
                type="button"
                id="cancelEdit"
                class="cancel"
                onclick="cancelEdit()"
            >
                CANCEL EDIT
            </button>

            <div
                id="teacherMessage"
                class="message"
            ></div>

        </form>

    </section>


    <!-- TEACHER LIST -->

    <section class="section">

        <div class="top">

            <h2>📋 Registered Teachers</h2>

            <input
                type="text"
                id="teacherSearch"
                class="search"
                placeholder="🔍 Search teacher..."
            >

        </div>

        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Class</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="teacherTable">
                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>
    © 2026 KITEGA PRIMARY SCHOOL
    <br>
    School Management System
</footer>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   EDITING ID
================================ */

let editingTeacherId = null;


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
}


/* ================================
   LOAD TEACHERS
================================ */

async function loadTeachers(searchText = "") {

    const table =
        document.getElementById("teacherTable");

    table.innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                Loading teachers...
            </td>
        </tr>
    `;


    const { data, error } =
        await supabaseClient
        .from("teachers")
        .select("*")
        .order("id", { ascending: false });


    if (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Failed to load teachers.
                    <br><br>
                    ${escapeHTML(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    let teachers = data || [];


    const search =
        searchText.toLowerCase().trim();


    if (search) {

        teachers = teachers.filter(function(teacher) {

            const text =
                (
                    teacher.full_name || ""
                ) + " " +
                (
                    teacher.username || ""
                ) + " " +
                (
                    teacher.class_name || ""
                ) + " " +
                (
                    teacher.phone || ""
                );

            return text
                .toLowerCase()
                .includes(search);
        });
    }


    table.innerHTML = "";


    if (teachers.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No teachers registered yet.
                </td>
            </tr>
        `;

        return;
    }


    teachers.forEach(function(teacher, index) {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(
                    teacher.full_name || "-"
                )}
            </td>

            <td>
                ${escapeHTML(
                    teacher.username || "-"
                )}
            </td>

            <td>
                ${escapeHTML(
                    teacher.class_name || "-"
                )}
            </td>

            <td>
                ${escapeHTML(
                    teacher.phone || "-"
                )}
            </td>

            <td>

                <button
                    class="edit"
                    onclick="editTeacher(${teacher.id})"
                >
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteTeacher(${teacher.id})"
                >
                    Delete
                </button>

            </td>
        `;


        table.appendChild(row);

    });

}


/* ================================
   REGISTER / UPDATE
================================ */

document
.getElementById("teacherForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const message =
            document.getElementById(
                "teacherMessage"
            );


        const fullName =
            document.getElementById(
                "teacherName"
            ).value.trim();


        const username =
            document.getElementById(
                "teacherUsername"
            ).value.trim();


        const className =
            document.getElementById(
                "teacherClass"
            ).value.trim();


        const phone =
            document.getElementById(
                "teacherPhone"
            ).value.trim();


        if (!fullName || !username) {

            message.style.color = "red";

            message.textContent =
                "Full name and username are required.";

            return;
        }


        /* UPDATE */

        if (editingTeacherId !== null) {

            const { error } =
                await supabaseClient
                .from("teachers")
                .update({

                    full_name: fullName,

                    username: username,

                    class_name:
                        className || null,

                    phone:
                        phone || null

                })
                .eq(
                    "id",
                    editingTeacherId
                );


            if (error) {

                console.error(error);

                message.style.color = "red";

                message.textContent =
                    "Failed to update teacher: " +
                    error.message;

                return;
            }


            message.style.color = "green";

            message.textContent =
                "Teacher updated successfully.";

            cancelEdit();

            loadTeachers();

            return;
        }


        /* INSERT */

        const { error } =
            await supabaseClient
            .from("teachers")
            .insert({

                full_name: fullName,

                username: username,

                class_name:
                    className || null,

                phone:
                    phone || null

            });


        if (error) {

            console.error(error);

            message.style.color = "red";


            if (error.code === "23505") {

                message.textContent =
                    "Username already exists.";

            } else {

                message.textContent =
                    "Failed to register teacher: " +
                    error.message;
            }

            return;
        }


        message.style.color = "green";

        message.textContent =
            "Teacher registered successfully.";


        document
        .getElementById("teacherForm")
        .reset();


        loadTeachers();

    }
);


/* ================================
   EDIT TEACHER
================================ */

async function editTeacher(id) {

    const { data, error } =
        await supabaseClient
        .from("teachers")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

        alert(
            "Failed to load teacher: " +
            error.message
        );

        return;
    }


    document.getElementById(
        "teacherName"
    ).value =
        data.full_name || "";


    document.getElementById(
        "teacherUsername"
    ).value =
        data.username || "";


    document.getElementById(
        "teacherClass"
    ).value =
        data.class_name || "";


    document.getElementById(
        "teacherPhone"
    ).value =
        data.phone || "";


    editingTeacherId = id;


    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ Edit Teacher";


    document.getElementById(
        "teacherSubmit"
    ).textContent =
        "UPDATE TEACHER";


    document.getElementById(
        "cancelEdit"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ================================
   CANCEL EDIT
================================ */

function cancelEdit() {

    editingTeacherId = null;


    document.getElementById(
        "teacherForm"
    ).reset();


    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ Register Teacher";


    document.getElementById(
        "teacherSubmit"
    ).textContent =
        "REGISTER TEACHER";


    document.getElementById(
        "cancelEdit"
    ).style.display =
        "none";


    document.getElementById(
        "teacherMessage"
    ).textContent = "";

}


/* ================================
   DELETE TEACHER
================================ */

async function deleteTeacher(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this teacher?"
        );


    if (!confirmDelete) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("teachers")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Failed to delete teacher: " +
            error.message
        );

        return;
    }


    loadTeachers();

}


/* ================================
   SEARCH
================================ */

document
.getElementById("teacherSearch")
.addEventListener(
    "input",
    function() {

        loadTeachers(
            this.value
        );

    }
);


/* ================================
   NAVIGATION
================================ */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


function logout() {

    window.location.href =
        "index.html";

}


/* ================================
   START
================================ */

loadTeachers();

</script>

</body>
</html>
