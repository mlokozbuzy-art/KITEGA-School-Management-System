<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timetable Management - KITEGA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#063b52;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    margin-top:5px;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:#087ea4;
    color:white;
}

.logout{
    background:#d92d20;
    color:white;
}

.container{
    width:94%;
    max-width:1250px;
    margin:25px auto;
}

.section{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:25px;
}

h1,h2{
    color:#063b52;
    margin-bottom:18px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input,select{
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:15px;
    background:white;
}

input:focus,select:focus{
    outline:none;
    border-color:#087ea4;
}

.submit{
    grid-column:1/-1;
    background:#063b52;
    color:white;
    font-size:15px;
}

.cancel{
    display:none;
    background:#667085;
    color:white;
}

.message{
    grid-column:1/-1;
    font-weight:bold;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.search{
    width:300px;
    padding:11px;
    border:1px solid #d0d5dd;
    border-radius:8px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eaecf0;
    text-align:left;
}

th{
    background:#eef8fb;
    color:#063b52;
}

.edit{
    background:#087ea4;
    color:white;
    margin-right:5px;
}

.delete{
    background:#d92d20;
    color:white;
}

.empty{
    text-align:center;
    padding:25px;
    color:#667085;
}

footer{
    text-align:center;
    padding:30px;
    color:#98a2b3;
    font-size:13px;
}

@media(max-width:650px){

    header{
        flex-direction:column;
        align-items:stretch;
    }

    .buttons{
        justify-content:flex-end;
    }

    .form{
        grid-template-columns:1fr;
    }

    .submit,
    .cancel,
    .message{
        grid-column:auto;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }
}
</style>
</head>

<body>

<header>

<div>
    <div class="title">🗓️ TIMETABLE MANAGEMENT</div>
    <div class="subtitle">KITEGA Primary School</div>
</div>

<div class="buttons">

<button class="back" onclick="goDashboard()">
← Dashboard
</button>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</header>


<main class="container">

<section class="section">

<h1 id="formTitle">
➕ Add Timetable Period
</h1>

<form id="timetableForm" class="form">

<div class="group">
<label>Day</label>

<select id="day" required>

<option value="">Select day</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>

</select>
</div>


<div class="group">
<label>Class</label>

<input
type="text"
id="className"
placeholder="Example: Standard 4">
</div>


<div class="group">
<label>Subject</label>

<input
type="text"
id="subjectName"
placeholder="Example: Mathematics"
required>
</div>


<div class="group">
<label>Teacher</label>

<input
type="text"
id="teacherName"
placeholder="Example: Mr. John">
</div>


<div class="group">
<label>Start Time</label>

<input
type="time"
id="startTime"
required>
</div>


<div class="group">
<label>End Time</label>

<input
type="time"
id="endTime"
required>
</div>


<div class="group">
<label>Room</label>

<input
type="text"
id="room"
placeholder="Example: Room 4">
</div>


<button
type="submit"
id="submitButton"
class="submit">

SAVE TIMETABLE

</button>


<button
type="button"
id="cancelButton"
class="cancel"
onclick="cancelEdit()">

CANCEL EDIT

</button>


<div id="message" class="message"></div>

</form>

</section>


<section class="section">

<div class="top">

<h2>📋 School Timetable</h2>

<input
type="text"
id="search"
class="search"
placeholder="🔍 Search timetable...">

</div>


<div class="table-box">

<table>

<thead>

<tr>
<th>#</th>
<th>Day</th>
<th>Time</th>
<th>Class</th>
<th>Subject</th>
<th>Teacher</th>
<th>Room</th>
<th>Action</th>
</tr>

</thead>

<tbody id="timetableTable"></tbody>

</table>

</div>

</section>

</main>


<footer>
© 2026 KITEGA PRIMARY SCHOOL
<br>
School Management System
</footer>


<script>

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let editingId = null;


function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;
}


/* LOAD TIMETABLE */

async function loadTimetable(searchText=""){

    const table =
    document.getElementById(
        "timetableTable"
    );

    table.innerHTML = `
    <tr>
        <td colspan="8" class="empty">
            Loading timetable...
        </td>
    </tr>
    `;


    const {data,error} =
    await supabaseClient
    .from("timetable")
    .select("*")
    .order("id",{ascending:false});


    if(error){

        table.innerHTML = `
        <tr>
            <td colspan="8" class="empty">
                Failed to load timetable.
                <br><br>
                ${escapeHTML(error.message)}
            </td>
        </tr>
        `;

        return;
    }


    let records = data || [];

    const search =
    searchText.toLowerCase().trim();


    if(search){

        records =
        records.filter(function(item){

            const text =
            (item.day || "") + " " +
            (item.class_name || "") + " " +
            (item.subject_name || "") + " " +
            (item.teacher_name || "") + " " +
            (item.room || "");

            return text
            .toLowerCase()
            .includes(search);

        });
    }


    table.innerHTML = "";


    if(records.length === 0){

        table.innerHTML = `
        <tr>
            <td colspan="8" class="empty">
                No timetable records found.
            </td>
        </tr>
        `;

        return;
    }


    records.forEach(function(item,index){

        const row =
        document.createElement("tr");


        row.innerHTML = `

        <td>${index + 1}</td>

        <td>${escapeHTML(item.day)}</td>

        <td>
            ${escapeHTML(item.start_time)}
            -
            ${escapeHTML(item.end_time)}
        </td>

        <td>
            ${escapeHTML(item.class_name || "-")}
        </td>

        <td>
            ${escapeHTML(item.subject_name || "-")}
        </td>

        <td>
            ${escapeHTML(item.teacher_name || "-")}
        </td>

        <td>
            ${escapeHTML(item.room || "-")}
        </td>

        <td>

            <button
            class="edit"
            onclick="editTimetable(${item.id})">
            Edit
            </button>

            <button
            class="delete"
            onclick="deleteTimetable(${item.id})">
            Delete
            </button>

        </td>

        `;

        table.appendChild(row);

    });

}


/* SAVE */

document
.getElementById("timetableForm")
.addEventListener("submit",async function(event){

    event.preventDefault();


    const message =
    document.getElementById("message");


    const day =
    document.getElementById("day").value;

    const className =
    document.getElementById("className").value.trim();

    const subjectName =
    document.getElementById("subjectName").value.trim();

    const teacherName =
    document.getElementById("teacherName").value.trim();

    const startTime =
    document.getElementById("startTime").value;

    const endTime =
    document.getElementById("endTime").value;

    const room =
    document.getElementById("room").value.trim();


    if(endTime <= startTime){

        message.style.color="red";

        message.textContent =
        "End time must be after start time.";

        return;
    }


    const record = {

        day: day,

        start_time: startTime,

        end_time: endTime,

        class_name:
        className || null,

        subject_name:
        subjectName,

        teacher_name:
        teacherName || null,

        room:
        room || null

    };


    let error;


    if(editingId !== null){

        const result =
        await supabaseClient
        .from("timetable")
        .update(record)
        .eq("id",editingId);

        error = result.error;

    }else{

        const result =
        await supabaseClient
        .from("timetable")
        .insert(record);

        error = result.error;

    }


    if(error){

        console.error(error);

        message.style.color="red";

        message.textContent =
        "Failed to save timetable: " +
        error.message;

        return;
    }


    message.style.color="green";

    message.textContent =
    editingId !== null
    ? "Timetable updated successfully."
    : "Timetable saved successfully.";


    cancelEdit();

    loadTimetable();

});


/* EDIT */

async function editTimetable(id){

    const {data,error} =
    await supabaseClient
    .from("timetable")
    .select("*")
    .eq("id",id)
    .single();


    if(error){

        alert(
            "Failed to load timetable: " +
            error.message
        );

        return;
    }


    document.getElementById("day").value =
    data.day || "";

    document.getElementById("className").value =
    data.class_name || "";

    document.getElementById("subjectName").value =
    data.subject_name || "";

    document.getElementById("teacherName").value =
    data.teacher_name || "";

    document.getElementById("startTime").value =
    data.start_time || "";

    document.getElementById("endTime").value =
    data.end_time || "";

    document.getElementById("room").value =
    data.room || "";


    editingId = id;


    document.getElementById("formTitle")
    .textContent =
    "✏️ Edit Timetable";


    document.getElementById("submitButton")
    .textContent =
    "UPDATE TIMETABLE";


    document.getElementById("cancelButton")
    .style.display =
    "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* CANCEL */

function cancelEdit(){

    editingId = null;

    document
    .getElementById("timetableForm")
    .reset();


    document.getElementById("formTitle")
    .textContent =
    "➕ Add Timetable Period";


    document.getElementById("submitButton")
    .textContent =
    "SAVE TIMETABLE";


    document.getElementById("cancelButton")
    .style.display =
    "none";


    document.getElementById("message")
    .textContent = "";

}


/* DELETE */

async function deleteTimetable(id){

    if(!confirm(
        "Are you sure you want to delete this timetable record?"
    )) return;


    const {error} =
    await supabaseClient
    .from("timetable")
    .delete()
    .eq("id",id);


    if(error){

        alert(
            "Failed to delete timetable: " +
            error.message
        );

        return;
    }


    loadTimetable();

}


/* SEARCH */

document
.getElementById("search")
.addEventListener("input",function(){

    loadTimetable(this.value);

});


/* NAVIGATION */

function goDashboard(){

    window.location.href =
    "dashboard.html";

}

function logout(){

    window.location.href =
    "index.html";

}


/* START */

loadTimetable();

</script>

</body>
  </html>
