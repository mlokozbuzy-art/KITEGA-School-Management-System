<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Results Management - KITEGA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#063b52;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    margin-top:5px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.back,
.logout{
    border:0;
    color:white;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:#087ea4;
}

.logout{
    background:#d92d20;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto;
}

.section{
    background:white;
    padding:25px;
    border-radius:15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.07);

    margin-bottom:25px;
}

h1{
    color:#063b52;
    margin-bottom:8px;
}

h2{
    color:#063b52;
    margin-bottom:20px;
}

.description{
    color:#667085;
    margin-bottom:20px;
}

.form{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    color:#344054;
    margin-bottom:7px;
}

input,
select{
    padding:12px;

    border:1px solid #d0d5dd;

    border-radius:8px;

    font-size:15px;

    background:white;
}

input:focus,
select:focus{
    outline:none;

    border-color:#087ea4;
}

.save{
    grid-column:1/-1;

    background:#063b52;

    color:white;

    border:0;

    padding:13px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    font-size:15px;
}

.save:hover{
    background:#07506d;
}

.message{
    grid-column:1/-1;

    font-weight:bold;

    padding:5px;
}

.search-box{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;
}

.search{
    width:280px;

    padding:11px;

    border:
    1px solid #d0d5dd;

    border-radius:8px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:900px;
}

th,
td{
    padding:12px;

    border-bottom:
    1px solid #eaecf0;

    text-align:left;
}

th{
    background:#eef8fb;

    color:#063b52;
}

td{
    color:#475467;
}

.empty{
    text-align:center;

    padding:25px;

    color:#667085;
}

.delete{
    background:#d92d20;

    color:white;

    border:0;

    padding:7px 10px;

    border-radius:6px;

    cursor:pointer;
}

footer{
    text-align:center;

    padding:30px;

    color:#98a2b3;

    font-size:13px;
}

@media(max-width:650px){

    .form{
        grid-template-columns:1fr;
    }

    .save{
        grid-column:auto;
    }

    .message{
        grid-column:auto;
    }

    .search-box{
        flex-direction:column;

        align-items:stretch;
    }

    .search{
        width:100%;
    }

    header{
        flex-direction:column;

        align-items:stretch;
    }

    .header-buttons{
        justify-content:flex-end;
    }

}

</style>

</head>


<body>


<header>

    <div>

        <div class="title">
            📊 RESULTS MANAGEMENT
        </div>

        <div class="subtitle">
            KITEGA Primary School
        </div>

    </div>


    <div class="header-buttons">

        <button
        class="back"
        onclick="goDashboard()">

            ← Dashboard

        </button>


        <button
        class="logout"
        onclick="logout()">

            Logout

        </button>

    </div>

</header>


<main class="container">


<!-- PAGE INTRODUCTION -->

<section class="section">

    <h1>
        Student Results
    </h1>

    <p class="description">

        Select a student, enter examination marks,
        then save the result.

    </p>

</section>


<!-- RESULT FORM -->

<section class="section">

<h2>
    ➕ Enter Student Result
</h2>


<form
id="resultForm"
class="form">


<!-- STUDENT -->

<div class="group">

<label>
Student
</label>


<select
id="student"
required>

<option value="">
Loading students...
</option>

</select>


<div
id="studentStatus"
style="
font-size:13px;
margin-top:6px;
color:#667085;
">

</div>

</div>


<!-- TERM -->

<div class="group">

<label>
Term
</label>


<select
id="term"
required>

<option value="">
Select term
</option>

<option value="Term 1">
Term 1
</option>

<option value="Term 2">
Term 2
</option>

<option value="Term 3">
Term 3
</option>

</select>

</div>


<!-- YEAR -->

<div class="group">

<label>
Academic Year
</label>


<input
id="year"
type="number"
value="2026"
required>

</div>


<!-- MATHEMATICS -->

<div class="group">

<label>
Mathematics
</label>


<input
id="mathematics"
type="number"
min="0"
max="100"
placeholder="0 - 100"
required>

</div>


<!-- ENGLISH -->

<div class="group">

<label>
English
</label>


<input
id="english"
type="number"
min="0"
max="100"
placeholder="0 - 100"
required>

</div>


<!-- KISWAHILI -->

<div class="group">

<label>
Kiswahili
</label>


<input
id="kiswahili"
type="number"
min="0"
max="100"
placeholder="0 - 100"
required>

</div>


<!-- SCIENCE -->

<div class="group">

<label>
Science
</label>


<input
id="science"
type="number"
min="0"
max="100"
placeholder="0 - 100"
required>

</div>


<!-- SOCIAL STUDIES -->

<div class="group">

<label>
Social Studies
</label>


<input
id="socialStudies"
type="number"
min="0"
max="100"
placeholder="0 - 100"
required>

</div>


<button
type="submit"
class="save">

    💾 SAVE RESULT

</button>


<div
id="message"
class="message">

</div>


</form>

</section>


<!-- RESULTS TABLE -->

<section class="section">

<div class="search-box">

<h2>
    📋 Saved Results
</h2>


<input
id="search"
class="search"
type="text"
placeholder="🔍 Search student...">

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>
#
</th>

<th>
Student
</th>

<th>
Term
</th>

<th>
Year
</th>

<th>
Total
</th>

<th>
Average
</th>

<th>
Grade
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody
id="resultTable">

</tbody>

</table>

</div>

</section>


</main>


<footer>

© 2026 KITEGA PRIMARY SCHOOL

<br>

School Management System

</footer>


<script>

/* ===================================
   SUPABASE CONNECTION
=================================== */

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ===================================
   ESCAPE HTML
=================================== */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;

}


/* ===================================
   LOAD STUDENTS
=================================== */

async function loadStudents(){

    const select =
    document.getElementById(
        "student"
    );


    const status =
    document.getElementById(
        "studentStatus"
    );


    select.innerHTML = `
        <option value="">
            Loading students...
        </option>
    `;


    const { data, error } =
    await supabaseClient

    .from("students")

    .select(
        "id, registration_no, full_name"
    )

    .order(
        "full_name",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);


        select.innerHTML = `
            <option value="">
                Failed to load students
            </option>
        `;


        status.style.color =
        "red";


        status.textContent =
        error.message;


        return;
    }


    select.innerHTML = `
        <option value="">
            Select student
        </option>
    `;


    if(!data || data.length === 0){

        select.innerHTML = `
            <option value="">
                No students registered
            </option>
        `;


        status.textContent =
        "Register students first.";


        return;
    }


    data.forEach(
        function(student){

            const option =
            document.createElement(
                "option"
            );


            option.value =
            student.id;


            option.textContent =
            student.registration_no +
            " - " +
            student.full_name;


            select.appendChild(
                option
            );

        }
    );


    status.style.color =
    "green";


    status.textContent =
    data.length +
    " student(s) available.";

}


/* ===================================
   GRADE
=================================== */

function getGrade(average){

    if(average >= 80)
        return "A";

    if(average >= 70)
        return "B";

    if(average >= 60)
        return "C";

    if(average >= 50)
        return "D";

    return "F";

}


/* ===================================
   SAVE RESULT
=================================== */

document
.getElementById("resultForm")
.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const message =
    document.getElementById(
        "message"
    );


    const studentId =
    document.getElementById(
        "student"
    ).value;


    if(!studentId){

        message.style.color =
        "red";


        message.textContent =
        "Please select a student.";


        return;
    }


    const mathematics =
    Number(
        document.getElementById(
            "mathematics"
        ).value
    );


    const english =
    Number(
        document.getElementById(
            "english"
        ).value
    );


    const kiswahili =
    Number(
        document.getElementById(
            "kiswahili"
        ).value
    );


    const science =
    Number(
        document.getElementById(
            "science"
        ).value
    );


    const socialStudies =
    Number(
        document.getElementById(
            "socialStudies"
        ).value
    );


    const total =
    mathematics +
    english +
    kiswahili +
    science +
    socialStudies;


    const average =
    total / 5;


    const grade =
    getGrade(average);


    const { error } =
    await supabaseClient

    .from("results")

    .insert({

        student_id:
        Number(studentId),

        term:
        document.getElementById(
            "term"
        ).value,

        academic_year:
        Number(
            document.getElementById(
                "year"
            ).value
        ),

        mathematics:
        mathematics,

        english:
        english,

        kiswahili:
        kiswahili,

        science:
        science,

        social_studies:
        socialStudies,

        total:
        Number(
            total.toFixed(2)
        ),

        average:
        Number(
            average.toFixed(2)
        ),

        grade:
        grade

    });


    if(error){

        console.error(error);


        message.style.color =
        "red";


        message.textContent =
        "Failed to save result: " +
        error.message;


        return;
    }


    message.style.color =
    "green";


    message.textContent =
    "Result saved successfully!";


    document
    .getElementById(
        "resultForm"
    )
    .reset();


    document.getElementById(
        "year"
    ).value =
    "2026";


    loadResults();

});


/* ===================================
   LOAD RESULTS
=================================== */

async function loadResults(
searchText = ""
){

    const table =
    document.getElementById(
        "resultTable"
    );


    table.innerHTML = `
        <tr>
            <td colspan="8"
            class="empty">
                Loading results...
            </td>
        </tr>
    `;


    const { data, error } =
    await supabaseClient

    .from("results")

    .select(`
        *,
        students(
            registration_no,
            full_name
        )
    `)

    .order(
        "id",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);


        table.innerHTML = `
            <tr>
                <td colspan="8"
                class="empty">

                    Failed to load results.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </td>
            </tr>
        `;


        return;
    }


    let results =
    data || [];


    const search =
    searchText
    .toLowerCase()
    .trim();


    if(search){

        results =
        results.filter(
            function(result){

                const student =
                result.students || {};


                const text =
                (
                    student.full_name || ""
                ) +
                " " +
                (
                    student.registration_no || ""
                ) +
                " " +
                (
                    result.term || ""
                );


                return text
                .toLowerCase()
                .includes(search);

            }
        );

    }


    table.innerHTML = "";


    if(results.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="8"
                class="empty">

                    No results found.

                </td>
            </tr>
        `;


        return;
    }


    results.forEach(
        function(result,index){

            const row =
            document.createElement(
                "tr"
            );


            const student =
            result.students || {};


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(
                        student.registration_no ||
                        "-"
                    )}

                    <br>

                    <small>
                        ${escapeHTML(
                            student.full_name ||
                            "-"
                        )}
                    </small>
                </td>

                <td>
                    ${escapeHTML(
                        result.term || "-"
                    )}
                </td>

                <td>
                    ${result.academic_year || "-"}
                </td>

                <td>
                    ${result.total ?? "-"}
                </td>

                <td>
                    ${result.average ?? "-"}
                </td>

                <td>
                    ${escapeHTML(
                        result.grade || "-"
                    )}
                </td>

                <td>

                    <button
                    class="delete"
                    onclick="
                    deleteResult(
                        ${result.id}
                    )">

                        Delete

                    </button>

                </td>
            `;


            table.appendChild(
                row
            );

        }
    );

}


/* ===================================
   DELETE RESULT
=================================== */

async function deleteResult(id){

    const confirmed =
    confirm(
        "Are you sure you want to delete this result?"
    );


    if(!confirmed)
        return;


    const { error } =
    await supabaseClient

    .from("results")

    .delete()

    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "Failed to delete result: " +
            error.message
        );


        return;
    }


    loadResults();

}


/* ===================================
   SEARCH
=================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        loadResults(
            this.value
        );

    }
);


/* ===================================
   NAVIGATION
=================================== */

function goDashboard(){

    window.location.href =
    "dashboard.html";

}


function logout(){

    window.location.href =
    "index.html";

}


/* ===================================
   START
=================================== */

loadStudents();

loadResults();

</script>


</body>

  </html>
