<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KITEGA School Management System - Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #063b52,
        #087ea4
    );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


/* ================= LOGIN CONTAINER ================= */

.login-wrapper{

    width:100%;

    max-width:430px;

}


/* ================= SCHOOL BRAND ================= */

.brand{

    text-align:center;

    color:white;

    margin-bottom:20px;

}

.logo{

    width:75px;

    height:75px;

    margin:0 auto 12px;

    background:white;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.18);

}

.brand h1{

    font-size:25px;

    margin-bottom:5px;

}

.brand p{

    font-size:13px;

    opacity:.9;

}


/* ================= LOGIN CARD ================= */

.login-card{

    background:white;

    border-radius:18px;

    padding:30px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.20);

}

.login-card h2{

    color:#063b52;

    font-size:22px;

    margin-bottom:7px;

}

.description{

    color:#667085;

    font-size:13px;

    line-height:1.5;

    margin-bottom:24px;

}


/* ================= FORM ================= */

.form-group{

    margin-bottom:18px;

}

label{

    display:block;

    color:#344054;

    font-weight:bold;

    font-size:14px;

    margin-bottom:7px;

}

.input-wrapper{

    position:relative;

}

input{

    width:100%;

    padding:13px 45px 13px 13px;

    border:
    1px solid #d0d5dd;

    border-radius:9px;

    font-size:15px;

    outline:none;

    transition:.2s;

}

input:focus{

    border-color:#087ea4;

    box-shadow:
    0 0 0 3px
    rgba(8,126,164,.10);

}


/* ================= SHOW PASSWORD ================= */

.toggle-password{

    position:absolute;

    right:10px;

    top:50%;

    transform:
    translateY(-50%);

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:18px;

    padding:5px;

}


/* ================= LOGIN BUTTON ================= */

.login-button{

    width:100%;

    border:0;

    background:#063b52;

    color:white;

    padding:14px;

    border-radius:9px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:.2s;

}

.login-button:hover{

    background:#087ea4;

}

.login-button:disabled{

    opacity:.7;

    cursor:not-allowed;

}


/* ================= MESSAGE ================= */

.message{

    margin-top:15px;

    padding:11px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;

    display:none;

}

.message.error{

    display:block;

    color:#b42318;

    background:#fef3f2;

    border:
    1px solid #fecdca;

}

.message.success{

    display:block;

    color:#027a48;

    background:#ecfdf3;

    border:
    1px solid #abefc6;

}


/* ================= DEMO INFO ================= */

.demo{

    margin-top:20px;

    padding:13px;

    background:#f8fafc;

    border:
    1px solid #eaecf0;

    border-radius:9px;

    font-size:12px;

    color:#667085;

}

.demo strong{

    color:#344054;

}


/* ================= FOOTER ================= */

.footer{

    text-align:center;

    color:white;

    font-size:12px;

    margin-top:20px;

    opacity:.85;

}


/* ================= LOADING ================= */

.spinner{

    display:inline-block;

    width:15px;

    height:15px;

    border:
    2px solid
    rgba(255,255,255,.4);

    border-top-color:white;

    border-radius:50%;

    animation:
    spin .7s linear infinite;

    vertical-align:middle;

    margin-right:7px;

}

@keyframes spin{

    to{

        transform:
        rotate(360deg);

    }

}


/* ================= MOBILE ================= */

@media(max-width:480px){

    body{

        padding:15px;

    }

    .login-card{

        padding:24px 20px;

    }

    .brand h1{

        font-size:22px;

    }

}

</style>

</head>


<body>


<div class="login-wrapper">


<!-- ================= BRAND ================= -->

<div class="brand">

<div class="logo">
🏫
</div>

<h1>
KITEGA SCHOOL
</h1>

<p>
School Management System
</p>

</div>


<!-- ================= LOGIN ================= -->

<div class="login-card">


<h2>
🔐 Administrator Login
</h2>


<p class="description">

Sign in to access the KITEGA School
Management System dashboard.

</p>


<form id="loginForm">


<!-- USERNAME -->

<div class="form-group">

<label for="username">

Username

</label>


<input

type="text"

id="username"

placeholder="Enter username"

autocomplete="username"

required>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">

Password

</label>


<div class="input-wrapper">

<input

type="password"

id="password"

placeholder="Enter password"

autocomplete="current-password"

required>


<button

type="button"

class="toggle-password"

id="togglePassword"

aria-label="Show password">

👁️

</button>

</div>

</div>


<!-- LOGIN BUTTON -->

<button

type="submit"

class="login-button"

id="loginButton">

LOGIN TO DASHBOARD

</button>


<!-- MESSAGE -->

<div

id="message"

class="message">

</div>


</form>


<!-- ================= DEMO LOGIN ================= -->

<div class="demo">

<strong>Demo Login</strong>

<br><br>

Username:
<strong>admin</strong>

<br>

Password:
<strong>1234</strong>

</div>


</div>


<!-- ================= FOOTER ================= -->

<div class="footer">

© 2026 KITEGA SCHOOL MANAGEMENT SYSTEM

<br><br>

Made by MsAbBe

</div>


</div>


<script>

/* =================================================
   LOGIN DETAILS
================================================= */

/*
   Hizi ni credentials za demo.
   Unaweza kuzibadilisha baadaye.
*/

const VALID_USERNAME =
"admin";

const VALID_PASSWORD =
"1234";


/* =================================================
   ELEMENTS
================================================= */

const loginForm =
document.getElementById(
    "loginForm"
);

const usernameInput =
document.getElementById(
    "username"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const message =
document.getElementById(
    "message"
);

const togglePassword =
document.getElementById(
    "togglePassword"
);


/* =================================================
   IF ALREADY LOGGED IN
================================================= */

function checkExistingLogin(){

    const loggedIn =
    sessionStorage.getItem(
        "kitiga_logged_in"
    );


    if(
        loggedIn === "true"
    ){

        window.location.replace(
            "dashboard.html"
        );

    }

}


/* =================================================
   SHOW / HIDE PASSWORD
================================================= */

togglePassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
            "text";

            togglePassword.textContent =
            "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        }

        else{

            passwordInput.type =
            "password";

            togglePassword.textContent =
            "👁️";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =================================================
   SHOW MESSAGE
================================================= */

function showMessage(
    text,
    type
){

    message.className =
    "message " +
    type;

    message.textContent =
    text;

}


/* =================================================
   LOGIN
================================================= */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const username =
        usernameInput.value.trim();


        const password =
        passwordInput.value;


        /*
           Clear previous message
        */

        message.className =
        "message";

        message.textContent =
        "";


        /*
           Validate
        */

        if(!username){

            showMessage(
                "Please enter your username.",
                "error"
            );

            usernameInput.focus();

            return;

        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /*
           Loading
        */

        loginButton.disabled =
        true;

        loginButton.innerHTML =
        '<span class="spinner"></span>Signing in...';


        /*
           Small delay for professional
           login experience
        */

        setTimeout(
            function(){

                /*
                   CHECK CREDENTIALS
                */

                if(
                    username ===
                    VALID_USERNAME
                    &&
                    password ===
                    VALID_PASSWORD
                ){

                    /*
                       IMPORTANT:
                       Save login status
                    */

                    sessionStorage.setItem(
                        "kitiga_logged_in",
                        "true"
                    );


                    /*
                       Optional user information
                    */

                    sessionStorage.setItem(
                        "kitiga_username",
                        username
                    );


                    showMessage(
                        "Login successful. Opening dashboard...",
                        "success"
                    );


                    /*
                       Prevent going back to
                       login after successful login
                    */

                    setTimeout(
                        function(){

                            window.location.replace(
                                "dashboard.html"
                            );

                        },
                        500
                    );

                }

                else{

                    /*
                       Wrong credentials
                    */

                    showMessage(
                        "Incorrect username or password.",
                        "error"
                    );


                    loginButton.disabled =
                    false;

                    loginButton.textContent =
                    "LOGIN TO DASHBOARD";


                    passwordInput.value =
                    "";

                    passwordInput.focus();

                }

            },
            500
        );

    }
);


/* =================================================
   PREVENT OLD DASHBOARD FROM BEING SHOWN
================================================= */

window.addEventListener(
    "pageshow",
    function(){

        const loggedIn =
        sessionStorage.getItem(
            "kitiga_logged_in"
        );


        /*
           If user is already logged in,
           don't show login page.
        */

        if(
            loggedIn === "true"
        ){

            window.location.replace(
                "dashboard.html"
            );

        }

    }
);


/* =================================================
   START
================================================= */

checkExistingLogin();

</script>


</body>

</html>
