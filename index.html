<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KITEGA School Management System</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #063b52,
        #087ea4
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.login-wrapper{
    width:100%;
    max-width:420px;
}

.brand{
    text-align:center;
    color:white;
    margin-bottom:22px;
}

.logo{
    width:78px;
    height:78px;

    margin:0 auto 12px;

    background:white;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:40px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.2);
}

.brand h1{
    font-size:25px;
    margin-bottom:5px;
}

.brand p{
    font-size:13px;
    opacity:.9;
}

.login-card{
    background:white;

    border-radius:18px;

    padding:30px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.2);
}

.login-card h2{
    color:#063b52;
    font-size:22px;
    margin-bottom:8px;
}

.description{
    color:#667085;
    font-size:13px;
    line-height:1.5;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;

    color:#344054;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;
}

input{
    width:100%;

    padding:13px;

    border:
    1px solid #d0d5dd;

    border-radius:9px;

    font-size:15px;

    outline:none;
}

input:focus{
    border-color:#087ea4;

    box-shadow:
    0 0 0 3px
    rgba(8,126,164,.1);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:48px;
}

.show-password{
    position:absolute;

    right:10px;

    top:50%;

    transform:
    translateY(-50%);

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:18px;
}

.login-button{
    width:100%;

    padding:14px;

    border:0;

    border-radius:9px;

    background:#063b52;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.login-button:hover{
    background:#087ea4;
}

.login-button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-top:15px;

    padding:11px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;
}

.message.error{
    display:block;

    color:#b42318;

    background:#fef3f2;

    border:
    1px solid #fecdca;
}

.message.success{
    display:block;

    color:#027a48;

    background:#ecfdf3;

    border:
    1px solid #abefc6;
}

.footer{
    text-align:center;

    color:white;

    font-size:12px;

    margin-top:20px;

    opacity:.85;
}

.spinner{
    display:inline-block;

    width:15px;
    height:15px;

    border:
    2px solid
    rgba(255,255,255,.4);

    border-top-color:white;

    border-radius:50%;

    animation:spin .7s linear infinite;

    vertical-align:middle;

    margin-right:7px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:480px){

    .login-card{
        padding:24px 20px;
    }

    .brand h1{
        font-size:22px;
    }

}

</style>

</head>


<body>


<div class="login-wrapper">


<!-- BRAND -->

<div class="brand">

    <div class="logo">
        🏫
    </div>

    <h1>
        KITEGA SCHOOL
    </h1>

    <p>
        School Management System
    </p>

</div>


<!-- LOGIN -->

<div class="login-card">

    <h2>
        🔐 Teacher Login
    </h2>

    <p class="description">
        Sign in to access the KITEGA School
        Management System dashboard.
    </p>


    <form id="loginForm">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="show-password"
                    id="showPassword">

                    👁️

                </button>

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-button"
            id="loginButton">

            LOGIN TO DASHBOARD

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


    </form>

</div>


<!-- FOOTER -->

<div class="footer">

    © 2026 KITEGA SCHOOL MANAGEMENT SYSTEM

    <br><br>

    Made by MsAbBe

</div>


</div>


<script>

/* ==========================================
   LOGIN DETAILS
========================================== */

const VALID_USERNAME = "teacher001";

const VALID_PASSWORD = "123456";


/* ==========================================
   ELEMENTS
========================================== */

const loginForm =
document.getElementById("loginForm");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");


/* ==========================================
   CHECK EXISTING LOGIN
========================================== */

if(
    sessionStorage.getItem(
        "kitiga_logged_in"
    ) === "true"
){

    window.location.replace(
        "dashboard.html"
    );

}


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
            "text";

            showPassword.textContent =
            "🙈";

        }else{

            passwordInput.type =
            "password";

            showPassword.textContent =
            "👁️";

        }

    }
);


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const username =
        usernameInput.value.trim();

        const password =
        passwordInput.value;


        message.className =
        "message";

        message.textContent =
        "";


        if(
            username ===
            VALID_USERNAME
            &&
            password ===
            VALID_PASSWORD
        ){

            loginButton.disabled =
            true;

            loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';


            /*
             SAVE LOGIN SESSION
            */

            sessionStorage.setItem(
                "kitiga_logged_in",
                "true"
            );


            sessionStorage.setItem(
                "kitiga_username",
                username
            );


            message.className =
            "message success";

            message.textContent =
            "Login successful. Opening dashboard...";


            setTimeout(
                function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                500
            );


        }else{

            message.className =
            "message error";

            message.textContent =
            "Incorrect username or password.";


            passwordInput.value =
            "";

            passwordInput.focus();

        }

    }
);


/* ==========================================
   BACK / PAGE CACHE PROTECTION
========================================== */

window.addEventListener(
    "pageshow",
    function(){

        if(
            sessionStorage.getItem(
                "kitiga_logged_in"
            ) === "true"
        ){

            window.location.replace(
                "dashboard.html"
            );

        }

    }
);

</script>


</body>

</html>
