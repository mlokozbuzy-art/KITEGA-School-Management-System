<!-- BACK BUTTON -->

<div
    id="backArea"
    class="back-area"
    style="display:none;"
>

    <button
        class="back-button"
        onclick="goBack()">

        ← Back

    </button>

</div>


<script>

function openTab(page, button){

    /*
    HOME
    */

    if(page === "home"){

        window.location.href =
        "dashboard.html";

        return;
    }


    /*
    BACK BUTTON
    */

    document.getElementById(
        "backArea"
    ).style.display = "block";


    /*
    OPEN PAGES
    */

    const pages = {

        students:
        "students.html",

        teachers:
        "teachers.html",

        classes:
        "classes.html",

        subjects:
        "subjects.html",

        attendance:
        "attendance.html",

        results:
        "results.html",

        timetable:
        "timetable.html",

        announcements:
        "announcements.html",

        payments:
        "payments.html",

        reports:
        "reports.html"

    };


    if(pages[page]){

        window.location.href =
        pages[page];

    }

}


function goBack(){

    window.history.back();

}

</script>
