<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KITEGA School Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

/* ================= HEADER ================= */

header{
    background:#063b52;
    color:white;
    padding:16px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:45px;
    height:45px;

    background:#087ea4;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:4px;
    opacity:.85;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:0;
    padding:10px 14px;
    border-radius:8px;

    cursor:pointer;
    font-weight:bold;
}

.back-btn{
    background:#087ea4;
    color:white;
}

.logout-btn{
    background:#d92d20;
    color:white;
}

.header-btn:hover{
    opacity:.9;
}

/* ================= LAYOUT ================= */

.layout{
    display:flex;
    min-height:calc(100vh - 77px);
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:255px;
    background:white;

    border-right:1px solid #e4e7ec;

    padding:20px 12px;

    position:sticky;
    top:77px;

    height:calc(100vh - 77px);

    overflow-y:auto;
}

.sidebar-title{
    font-size:11px;
    color:#98a2b3;

    font-weight:bold;

    padding:10px 14px;

    letter-spacing:.5px;
}

.sidebar a{
    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:#344054;

    padding:12px 14px;

    margin:4px 0;

    border-radius:9px;

    font-size:14px;

    transition:.2s;
}

.sidebar a:hover{
    background:#eef8fb;
    color:#063b52;
}

.sidebar a.active{
    background:#063b52;
    color:white;
}

/* ================= CONTENT ================= */

.content{
    flex:1;
    padding:28px;

    max-width:1600px;
}

/* ================= PAGE TOP ================= */

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;

    gap:15px;
}

.page-top h1{
    color:#063b52;
    font-size:27px;
}

.page-top p{
    color:#667085;
    margin-top:6px;
    font-size:14px;
}

.mobile-back{
    display:none;

    background:white;

    border:1px solid #d0d5dd;

    padding:9px 13px;

    border-radius:8px;

    color:#344054;

    font-weight:bold;
}

/* ================= WELCOME ================= */

.welcome{
    background:linear-gradient(
        135deg,
        #063b52,
        #087ea4
    );

    color:white;

    padding:28px;

    border-radius:16px;

    margin-bottom:24px;

    box-shadow:
    0 8px 25px rgba(6,59,82,.15);
}

.welcome h2{
    font-size:24px;
    margin-bottom:8px;
}

.welcome p{
    opacity:.9;
    line-height:1.6;
}

/* ================= STATISTICS ================= */

.section-title{
    color:#063b52;
    font-size:18px;
    margin-bottom:14px;
}

.cards{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:17px;

    margin-bottom:25px;
}

.card{
    background:white;

    padding:20px;

    border-radius:14px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.06);

    border:1px solid #eef0f3;

    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);

    box-shadow:
    0 8px 20px rgba(0,0,0,.09);
}

.card-top{
    display:flex;

    justify-content:space-between;

    align-items:center;
}

.card-icon{
    width:43px;
    height:43px;

    border-radius:10px;

    background:#eef8fb;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;
}

.card-title{
    color:#667085;

    font-size:13px;

    margin-top:15px;
}

.card-number{
    color:#063b52;

    font-size:27px;

    font-weight:bold;

    margin-top:6px;
}

.card-link{
    display:inline-block;

    margin-top:13px;

    color:#087ea4;

    text-decoration:none;

    font-size:12px;

    font-weight:bold;
}

/* ================= TWO COLUMN ================= */

.dashboard-grid{
    display:grid;

    grid-template-columns:
    1.5fr 1fr;

    gap:20px;

    margin-bottom:25px;
}

.panel{
    background:white;

    border-radius:15px;

    padding:22px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.06);

    border:1px solid #eef0f3;
}

.panel-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.panel-header h2{
    color:#063b52;

    font-size:18px;
}

.view-link{
    color:#087ea4;

    text-decoration:none;

    font-size:13px;

    font-weight:bold;
}

/* ================= REPORT ================= */

.report-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.report-item{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:14px;

    background:#f8fafc;

    border-radius:10px;
}

.report-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.report-icon{
    width:38px;
    height:38px;

    background:#eef8fb;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.report-name{
    font-weight:bold;
    color:#344054;
    font-size:14px;
}

.report-desc{
    font-size:12px;
    color:#98a2b3;
    margin-top:3px;
}

.report-number{
    color:#063b52;
    font-weight:bold;
}

/* ================= PAYMENT ================= */

.payment-box{
    background:
