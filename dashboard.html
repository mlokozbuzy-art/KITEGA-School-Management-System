<!-- =========================
     RESULTS MANAGEMENT
========================= -->

<section class="section">

    <h2>📊 Results Management</h2>

    <form id="resultForm" class="form">

        <div class="group">
            <label>Student</label>
            <select id="resultStudent" required>
                <option value="">Select student</option>
            </select>
        </div>

        <div class="group">
            <label>Term</label>
            <select id="resultTerm" required>
                <option value="">Select term</option>
                <option value="Term 1">Term 1</option>
                <option value="Term 2">Term 2</option>
                <option value="Term 3">Term 3</option>
            </select>
        </div>

        <div class="group">
            <label>Academic Year</label>
            <input id="resultYear" type="number" value="2026" required>
        </div>

        <div class="group">
            <label>Mathematics</label>
            <input id="math" type="number" min="0" max="100" step="0.01" required>
        </div>

        <div class="group">
            <label>English</label>
            <input id="english" type="number" min="0" max="100" step="0.01" required>
        </div>

        <div class="group">
            <label>Kiswahili</label>
            <input id="kiswahili" type="number" min="0" max="100" step="0.01" required>
        </div>

        <div class="group">
            <label>Science</label>
            <input id="science" type="number" min="0" max="100" step="0.01" required>
        </div>

        <div class="group">
            <label>Social Studies</label>
            <input id="socialStudies" type="number" min="0" max="100" step="0.01" required>
        </div>

        <button class="submit" type="submit">
            💾 SAVE RESULT
        </button>

        <div id="resultMessage" class="message"></div>

    </form>


    <div class="list-header">

        <h3>Student Results</h3>

        <input
            id="resultSearch"
            class="search"
            type="text"
            placeholder="🔍 Search result">

    </div>


    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Student</th>
                    <th>Term</th>
                    <th>Year</th>
                    <th>Total</th>
                    <th>Average</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="resultTable"></tbody>

        </table>

    </div>

</section>


<script>

/* =================================
   RESULTS MANAGEMENT
================================= */

let allResultStudents = [];


/* LOAD STUDENTS INTO RESULT SELECT */

async function loadResultStudents(){

    const select =
        document.getElementById("resultStudent");

    const { data, error } =
        await supabaseClient
        .from("students")
        .select("id, registration_no, full_name")
        .order("full_name");

    if(error){

        console.error(error);

        return;
    }

    allResultStudents = data || [];

    select.innerHTML =
        '<option value="">Select student</option>';

    allResultStudents.forEach(function(student){

        const option =
            document.createElement("option");

        option.value = student.id;

        option.textContent =
            student.registration_no +
            " - " +
            student.full_name;

        select.appendChild(option);

    });

}


/* GRADE */

function calculateGrade(average){

    if(average >= 80) return "A";
    if(average >= 70) return "B";
    if(average >= 60) return "C";
    if(average >= 50) return "D";

    return "F";
}


/* LOAD RESULTS */

async function loadResults(searchText = ""){

    const table =
        document.getElementById("resultTable");

    const { data, error } =
        await supabaseClient
        .from("results")
        .select(`
            *,
            students (
                registration_no,
                full_name
            )
        `)
        .order("id", {
            ascending:false
        });

    if(error){

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Failed to load results.
                </td>
            </tr>
        `;

        return;
    }


    let results = data || [];

    const search =
        searchText.toLowerCase().trim();


    if(search){

        results =
            results.filter(function(result){

                const student =
                    result.students || {};

                const text =
                    (
                        student.full_name || ""
                    ) +
                    " " +
                    (
                        student.registration_no || ""
                    ) +
                    " " +
                    (
                        result.term || ""
                    );

                return text
                    .toLowerCase()
                    .includes(search);

            });

    }


    table.innerHTML = "";


    if(results.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No results found.
                </td>
            </tr>
        `;

        return;
    }


    results.forEach(function(result,index){

        const row =
            document.createElement("tr");

        const student =
            result.students || {};


        row.innerHTML = `

            <td>${index + 1}</td>

            <td>
                ${escapeHTML(
                    student.full_name || "-"
                )}
            </td>

            <td>
                ${escapeHTML(
                    result.term
                )}
            </td>

            <td>
                ${result.academic_year}
            </td>

            <td>
                ${result.total ?? "-"}
            </td>

            <td>
                ${result.average ?? "-"}
            </td>

            <td>
                ${escapeHTML(
                    result.grade || "-"
                )}
            </td>

            <td>

                <button
                    class="btn delete"
                    onclick="deleteResult(${result.id})">

                    Delete

                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


/* SAVE RESULT */

document
.getElementById("resultForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const message =
            document.getElementById(
                "resultMessage"
            );


        const mathematics =
            Number(
                document.getElementById(
                    "math"
                ).value
            );

        const english =
            Number(
                document.getElementById(
                    "english"
                ).value
            );

        const kiswahili =
            Number(
                document.getElementById(
                    "kiswahili"
                ).value
            );

        const science =
            Number(
                document.getElementById(
                    "science"
                ).value
            );

        const socialStudies =
            Number(
                document.getElementById(
                    "socialStudies"
                ).value
            );


        const total =
            mathematics +
            english +
            kiswahili +
            science +
            socialStudies;


        const average =
            total / 5;


        const grade =
            calculateGrade(average);


        const resultData = {

            student_id:
                Number(
                    document.getElementById(
                        "resultStudent"
                    ).value
                ),

            term:
                document.getElementById(
                    "resultTerm"
                ).value,

            academic_year:
                Number(
                    document.getElementById(
                        "resultYear"
                    ).value
                ),

            mathematics:
                mathematics,

            english:
                english,

            kiswahili:
                kiswahili,

            science:
                science,

            social_studies:
                socialStudies,

            total:
                Number(
                    total.toFixed(2)
                ),

            average:
                Number(
                    average.toFixed(2)
                ),

            grade:
                grade

        };


        const { error } =
            await supabaseClient
            .from("results")
            .insert(resultData);


        if(error){

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Failed to save result: " +
                error.message;

            return;
        }


        message.style.color = "green";

        message.textContent =
            "Result saved successfully.";


        document
        .getElementById(
            "resultForm"
        )
        .reset();


        document
        .getElementById(
            "resultYear"
        )
        .value = 2026;


        loadResults();

    }
);


/* DELETE RESULT */

async function deleteResult(id){

    if(
        !confirm(
            "Delete this result?"
        )
    ){

        return;

    }


    const { error } =
        await supabaseClient
        .from("results")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "Failed to delete result: " +
            error.message
        );

        return;
    }


    loadResults();

}


/* SEARCH */

document
.getElementById("resultSearch")
.addEventListener(
    "input",
    function(){

        loadResults(
            this.value
        );

    }
);


/* START RESULTS */

loadResultStudents();

loadResults();

</script>
